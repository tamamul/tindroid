// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.0.1'

        // For FCM push notifications
        classpath 'com.google.gms:google-services:4.4.4'

        // Crashlytics
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'

        // Legal compliance: plugin to collect and display OSS licenses.
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// This block encapsulates custom properties and makes them available to all
// modules in the project.
ext {
    version_code = gitVersionCode()
    version_name = gitVersionName()
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.google.com/' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

// Use git revision counter as a version code.
static def gitVersionCode() {
    try {
        def process = "git rev-list --count HEAD".execute()
        def count = process.text.trim()
        return count.isInteger() ? count.toInteger() : 1
    } catch (Exception e) {
        return 1
    }
}

static def gitVersionName() {
    try {
        def process = "git describe --tags --always".execute()
        def text = process.text.trim()
        if (text.startsWith("v")) return text.substring(1)
        return text ?: "1.0.0"
    } catch (Exception e) {
        return "1.0.0"
    }
}