name: Android Build CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Create dummy google-services.json
      run: |
        cat > app/google-services.json << 'EOF'
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "ci-dummy-project"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {
                  "package_name": "co.tinode.tindroidx"
                }
              }
            }
          ]
        }
        EOF
        echo "✅ Created dummy google-services.json"
    
    - name: Create dummy git tag (if no tags exist)
      run: |
        if ! git describe --tags >/dev/null 2>&1; then
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git tag v1.0.0
          echo "✅ Created dummy git tag v1.0.0"
        else
          echo "✅ Git tags already exist"
        fi
        echo "Current git describe: $(git describe --tags 2>/dev/null || echo 'none')"
        echo "Commit count: $(git rev-list --count HEAD)"
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    # Clear Gradle cache to force use Gradle 8.9
    - name: Clean old Gradle distributions
      run: |
        rm -rf ~/.gradle/wrapper/dists/gradle-8.7*
        rm -rf ~/.gradle/caches/
    
    - name: Clean build
      run: ./gradlew clean --no-daemon
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --no-daemon
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
    
    - name: Upload build logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/reports/
          app/build/reports/
          .gradle/
        retention-days: 7