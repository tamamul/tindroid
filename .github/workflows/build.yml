name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Ambil semua history untuk git describe
        # Juga ambil semua tag
        fetch-tags: true
    
    - name: Verify git tags
      run: |
        git tag -l
        echo "Current branch: $(git branch --show-current)"
        echo "Latest commit: $(git log -1 --format='%H')"
        echo "Commit count: $(git rev-list --count HEAD)"
        echo "Latest tag: $(git describe --tags 2>/dev/null || echo 'No tags found')"
    
    - name: Set up JDK 17
      uses: setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean build cache
      run: |
        ./gradlew clean
        rm -rf ~/.gradle/caches/transforms-*
        rm -rf ~/.gradle/caches/build-cache-*
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --no-daemon
    
    - name: Upload Debug APK
      uses: upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30